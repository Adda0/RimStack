version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cxx-qt:
        patterns: ["cxx", "cxx-*", "cxxbridge-*", "cxx-qt*", "qt-build-utils"]
      icu:
        patterns: ["icu_*"]
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "Dependencies:"

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI:"
